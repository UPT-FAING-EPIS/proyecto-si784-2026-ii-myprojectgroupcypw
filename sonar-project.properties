# Análisis de calidad con SonarQube Cloud (workflow .github/workflows/sonarqube.yml).
# sonar.organization y sonar.projectKey se pasan desde el workflow (variables
# del repositorio SONAR_ORGANIZATION y SONAR_PROJECT_KEY) para no fijarlos aquí.
sonar.projectName=NotaryVerify
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend
sonar.tests=backend/tests
sonar.exclusions=**/__pycache__/**,frontend/legacy-baseline/**,frontend/e2e/**,backend/data/**
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/pytest-report.xml
