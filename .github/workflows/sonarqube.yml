# Análisis de calidad con SonarQube Cloud y reporte de Bugs, Vulnerabilities y
# Security Hotspots. Requiere el secreto SONAR_TOKEN; opcionalmente las
# variables SONAR_ORGANIZATION, SONAR_PROJECT_KEY y SONAR_HOST_URL.
name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

env:
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'upt-faing-epis' }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'UPT-FAING-EPIS_proyecto-si784-2026-ii-myprojectgroupcypw' }}

jobs:
  sonarqube:
    name: Análisis SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Comprobar SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::Configure el secreto SONAR_TOKEN para ejecutar el análisis."
            echo "Análisis omitido: falta el secreto SONAR_TOKEN." >> "$GITHUB_STEP_SUMMARY"
            echo "disponible=false" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.disponible == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.token.outputs.disponible == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: apt-get install libegl1 libgles2 libgl1
        if: steps.token.outputs.disponible == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2 libgl1

      - name: pytest con cobertura
        if: steps.token.outputs.disponible == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov
          python -m pytest -q --cov=app --cov-report=xml:coverage.xml --junitxml=pytest-report.xml

      - name: SonarQube Scan
        if: steps.token.outputs.disponible == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        continue-on-error: true

      - name: Reporte de Bugs, Vulnerabilities y Security Hotspots
        if: steps.token.outputs.disponible == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: python .github/scripts/reporte_sonar.py sonar-reporte.md

      - name: Publicar reporte
        if: always() && steps.token.outputs.disponible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-reporte
          path: |
            sonar-reporte.md
            backend/coverage.xml
            backend/pytest-report.xml
          if-no-files-found: ignore
          retention-days: 30
