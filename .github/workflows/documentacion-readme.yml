# Genera la sección automática del README.md: diccionario de datos, diagrama
# entidad-relación, diagrama de clases, de componentes y de despliegue.
# En pull requests solo comprueba; en main regenera y confirma el cambio.
name: Documentación README

on:
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - ".github/scripts/generar_documentacion.py"
      - ".github/workflows/documentacion-readme.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - ".github/scripts/generar_documentacion.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentacion-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: Generar documentación en README.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # El generador solo importa los modelos SQLAlchemy; no requiere OpenCV ni MediaPipe.
      - name: pip install sqlalchemy
        run: python -m pip install "sqlalchemy>=2.0"

      - name: Comprobar README (pull request)
        if: github.event_name == 'pull_request'
        run: python .github/scripts/generar_documentacion.py --check

      - name: Regenerar README
        if: github.event_name != 'pull_request'
        run: python .github/scripts/generar_documentacion.py

      - name: Confirmar cambios
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md ya estaba actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: regenerar documentación automática del README [skip ci]"
          git push || echo "::warning::No se pudo publicar en la rama (¿protegida?). Descargue el artefacto README."

      - name: Publicar README generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-generado
          path: README.md
          retention-days: 14
